<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>My Portfolio</h1>
  </header>

  <main>
    <div class="card">
      <img class="avatar" src="photo.jpeg" alt="Profile avatar" width="150">
      <div class="card-text">
        <h2 class="name">Aben Dilnaz</h2>
        <p class="bio">
          I'm a IT management student passionate about web development
          and cloud computing. I enjoy building small projects that solve
          real problems and learning new frameworks along the way.
        </p>
        <div class="links">
          <a href="mailto:aben.dilnazz06@gmail.com">Email</a>
          <a href="https://github.com/abendii12" target="_blank">GitHub</a>
          <button class="like-btn">🤍 Like</button>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Aben Dilnaz. Built for IWaMAD.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
